<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love.exe</title>
<style>
body {
    background: black;
    color: #00ff9c;
    font-family: "Courier New", monospace;
    text-align: center;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#terminal {
    border: 2px solid #00ff9c;
    padding: 20px;
    width: 90%;
    max-width: 700px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 0 15px #00ff9c;
}

button {
    margin-top:20px;
    padding:12px 20px;
    background:#00ff9c;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

img {
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
    margin-top: 20px;
    border-radius: 12px;
    display: block;
    padding: 10px;
    background: #001a12;
    box-shadow: 0 0 25px rgba(0,255,156,0.45);
}

#progressContainer {
    width:100%;
    background:#003d2b;
    margin-top:5px;
    height:15px;
    display:none;
}

#progressBar {
    width:0%;
    height:100%;
    background:#00ff9c;
    transition: width 0.4s ease;
}

.fade { animation: fade 0.8s ease-in; }
@keyframes fade { from{opacity:0;} to{opacity:1;} }

#replayBtn { 
    display:none; 
}
</style>
</head>
<body>

<audio id="bgm" src="music.mp3" loop></audio>

<div id="terminal">
    <p id="message">Press Start Love.exe</p>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
    <img id="photo" src="" style="display:none">
    <button id="startBtn" onclick="startBoot()">Start Love.exe</button>
    <button id="nextBtn" onclick="nextStory()" style="display:none">Next</button>
    <button id="replayBtn" onclick="restartStory()">Replay Story</button>
</div>

<script>
let storyIndex = 0;
let bootIndex = 0;
let progress = 0;

const bootLines = [
"Initializing Love Kernel...",
"Loading Shared Memories...",
"Checking Compatibility... Perfect Match Found",
"Launching Forever Service...",
"Welcome to LoveOS"
];

const story = [
{ text: "Every story has a beginning... Ours is my favorite.", img: "photo1.jpg" },
{ text: "Somehow every day with you becomes my best memory.", img: "photo2.jpg" },
{ text: "And I cannot wait to build a lifetime of adventures together.", img: "photo3.jpg" },
{ text: "Happy Valentine's Day ❤️", img: "photo4.jpg" }
];

function startBoot(){
    document.getElementById("startBtn").style.display="none";
    document.getElementById("message").innerHTML="";
    document.getElementById("bgm").play();
    document.getElementById("progressContainer").style.display="block";
    runBoot();
}

function runBoot(){
    if(bootIndex < bootLines.length){
        document.getElementById("message").innerHTML += bootLines[bootIndex] + "<br>";
        bootIndex++;
        progress += 20;
        document.getElementById("progressBar").style.width = progress + "%";
        setTimeout(runBoot, 1200);
    } else {
        document.getElementById("message").innerHTML = "System Ready.\n100%\nClick Next.";
        document.getElementById("nextBtn").style.display="inline-block";
    }
}

function typeWriter(text, i){
    const el = document.getElementById("message");
    if(i < text.length){
        el.innerHTML += text.charAt(i);
        setTimeout(() => typeWriter(text, i + 1), 35);
    }
}

function nextStory(){
    if(storyIndex < story.length){
        document.getElementById("progressContainer").style.display="none";
        const item = story[storyIndex];
        document.getElementById("message").innerHTML = "";
        typeWriter(item.text, 0);
        const img = document.getElementById("photo");
        img.src = item.img;
        img.style.display = "block";
        img.classList.add("fade");
        storyIndex++;
    } else {
        document.getElementById("message").innerHTML = "Forever loading... ❤️";
        document.getElementById("nextBtn").style.display="none";
        document.getElementById("photo").src = "photo5.jpg";
        document.getElementById("replayBtn").style.display="inline-block";
    }
}

function restartStory(){
    storyIndex = 0;
    bootIndex = 0;
    progress = 0;
    document.getElementById("progressBar").style.width = "0%";
    document.getElementById("progressContainer").style.display="none";
    document.getElementById("replayBtn").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("startBtn").style.display="inline-block";
    document.getElementById("message").innerHTML = "Press Start Love.exe";
    document.getElementById("photo").style.display="none";
}
</script>

</body>
</html>
