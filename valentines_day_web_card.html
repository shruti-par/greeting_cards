<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love.exe</title>
<style>
body {
    background:black;
    color:#00ff9c;
    font-family: "Courier New", monospace;
    text-align:center;
    padding:40px;
}

#terminal {
    border:2px solid #00ff9c;
    padding:30px;
    min-height:300px;
    margin:auto;
    max-width:700px;
    box-shadow:0 0 15px #00ff9c;
}

button {
    margin-top:20px;
    padding:12px 20px;
    background:#00ff9c;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

img {
    margin-top:20px;
    max-width:100%;
    border-radius:10px;
}

.fade { animation: fade 0.8s ease-in; }
@keyframes fade { from{opacity:0;} to{opacity:1;} }

#replayBtn { display:none; }
</style>
</head>
<body>

<h2>Love.exe</h2>

<audio id="bgm" src="music.mp3" loop></audio>

<div id="terminal">
<p id="message">Press Start Love.exe</p>
<img id="photo" src="" style="display:none">
</div>

<button id="startBtn" onclick="startBoot()">Start Love.exe</button>
<button id="nextBtn" onclick="nextStory()" style="display:none">Next</button>
<button id="replayBtn" onclick="restartStory()">Replay Story</button>

<script>
let storyIndex = 0;

const bootLines = [
"Initializing Love Kernel...",
"Loading Shared Memories...",
"Checking Compatibility... Perfect Match Found",
"Launching Forever Service...",
"Welcome to LoveOS"
];

const story = [
{ text: "Every story has a beginning... Ours is my favorite.", img: "photo1.jpg" },
{ text: "Somehow every day with you becomes my best memory.", img: "photo2.jpg" },
{ text: "And I cannot wait to build a lifetime of adventures together.", img: "photo3.jpg" },
{ text: "Happy Valentine's Day ❤️", img: "photo4.jpg" }
];

let bootIndex = 0;

function startBoot(){
    document.getElementById("startBtn").style.display="none";
    const term = document.getElementById("message");
    term.innerHTML="";
    document.getElementById("bgm").play();
    runBoot();
}

function runBoot(){
    if(bootIndex < bootLines.length){
        document.getElementById("message").innerHTML += bootLines[bootIndex] + "<br>";
        bootIndex++;
        setTimeout(runBoot, 1000);
    } else {
        document.getElementById("nextBtn").style.display="inline-block";
        document.getElementById("message").innerHTML = "System Ready. Click Next.";
    }
}

function typeWriter(text, i, callback){
    const el = document.getElementById("message");
    if(i < text.length){
        el.innerHTML += text.charAt(i);
        setTimeout(() => typeWriter(text, i + 1, callback), 35);
    } else if(callback){
        callback();
    }
}

function nextStory(){
    if(storyIndex < story.length){
        const item = story[storyIndex];
        document.getElementById("message").innerHTML = "";
        typeWriter(item.text, 0);
        const img = document.getElementById("photo");
        img.src = item.img;
        img.style.display = "block";
        img.classList.add("fade");
        storyIndex++;
    } else {
        document.getElementById("message").innerHTML = "Forever loading... ❤️";
        document.getElementById("nextBtn").style.display="none";
        document.getElementById("photo").src = "none";
        document.getElementById("replayBtn").style.display="inline-block";
    }
}

function restartStory(){
    storyIndex = 0;
    bootIndex = 0;
    document.getElementById("replayBtn").style.display="none";
    document.getElementById("startBtn").style.display="inline-block";
    document.getElementById("message").innerHTML = "Press Start Love.exe";
    document.getElementById("photo").style.display="none";
}
</script>

</body>
</html>
