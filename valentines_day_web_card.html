<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: monospace;
    background: #000;
    color: #00ff9c;
    text-align: center;
    overflow-x: hidden;
  }

  .terminal {
    max-width: 800px;
    margin: 60px auto;
    padding: 20px;
    border-radius: 12px;
    background: #050505;
    box-shadow: 0 0 20px rgba(0,255,156,0.2);
  }

  img {
    width: 100%;
    border-radius: 14px;
    margin-top: 20px;
  }

  .controls {
    margin-top: 30px;
  }

  button {
    background: #ff4d6d;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
    margin: 5px;
  }

  .cmd {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  input {
    background: black;
    border: 1px solid #00ff9c;
    color: #00ff9c;
    padding: 8px;
    font-family: monospace;
    width: 260px;
  }

  .progress {
    width: 100%;
    height: 18px;
    border: 1px solid #00ff9c;
    margin-top: 20px;
    display: none;
  }

  .bar {
    height: 100%;
    width: 0%;
    background: #00ff9c;
  }

  .final-screen {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    color: #ff4d6d;
    text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d;
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }

  .final-screen.show { opacity: 1; pointer-events: auto; }

  #qrcode { margin-top: 20px; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="terminal">
  <div id="terminalText">Type <b>run love.sh</b> and press Enter</div>

  <div class="cmd">
    <span>$</span>
    <input id="commandInput" placeholder="run love.sh">
  </div>

  <div class="progress" id="progressBox"><div class="bar" id="progressBar"></div></div>

  <img id="storyImage" class="hidden">

  <div class="controls">
    <button id="nextBtn" class="hidden">Next ➜</button>
  </div>
</div>

<div class="final-screen" id="finalScreen">
  <div>Process completed successfully:<br>Husband.exe permanently linked ❤️</div>
  <button onclick="location.reload()">Replay Story</button>
  <div id="qrcode"></div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const story = [
  {text: "Booting LoveOS...", image: null},
  {text: "Loading our first memory... The day our story began.", image: "photo1.jpg"},
  {text: "Initializing adventure module... Every journey is better with you.", image: "photo2.jpg"},
  {text: "Running happiness.exe... You make ordinary days extraordinary.", image: "photo3.jpg"},
  {text: "Final message: Forever isn't long enough with you ❤️", image: "photo4.jpg"}
];

let index = 0;
const terminal = document.getElementById('terminalText');
const image = document.getElementById('storyImage');
const nextBtn = document.getElementById('nextBtn');
const music = document.getElementById('music');
const input = document.getElementById('commandInput');
const progressBox = document.getElementById('progressBox');
const progressBar = document.getElementById('progressBar');
const finalScreen = document.getElementById('finalScreen');

function typeWriter(text, callback) {
  terminal.textContent = "";
  let i = 0;
  function type() {
    if (i < text.length) {
      terminal.textContent += text.charAt(i);
      i++;
      setTimeout(type, 35);
    } else if (callback) callback();
  }
  type();
}

function showStep() {
  const step = story[index];
  typeWriter(step.text, () => {
    if (step.image) {
      image.src = step.image;
      image.classList.remove('hidden');
    } else {
      image.classList.add('hidden');
    }
  });
}

function runLoader(callback) {
  progressBox.style.display = 'block';
  let percent = 0;
  const loader = setInterval(() => {
    percent += 5;
    progressBar.style.width = percent + '%';
    terminal.textContent = "Loading modules: laughter.dll, adventures.pkg, forever.sys... " + percent + "%";
    if (percent >= 100) {
      clearInterval(loader);
      progressBox.style.display = 'none';
      callback();
    }
  }, 120);
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (input.value.trim().toLowerCase() === 'run love.sh') {
      music.play();
      input.parentElement.classList.add('hidden');
      runLoader(() => {
        nextBtn.classList.remove('hidden');
        index = 0;
        showStep();
      });
    } else {
      terminal.textContent = "Command not recognized. Try: run love.sh";
    }
  }
});

nextBtn.onclick = () => {
  index++;
  if (index < story.length) {
    showStep();
  } else {
    finalScreen.classList.add('show');
    new QRCode(document.getElementById('qrcode'), window.location.href);
  }
};

// Easter egg: type LOVE anywhere
let buffer = '';
document.addEventListener('keydown', e => {
  buffer += e.key.toLowerCase();
  buffer = buffer.slice(-4);
  if (buffer === 'love') {
    alert('Secret message unlocked: You are my favorite human ❤️');
  }
});
</script>

</body>
</html>
